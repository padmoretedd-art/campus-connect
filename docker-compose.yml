services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus_connect
      POSTGRES_PASSWORD: campus_connect_dev_password
      POSTGRES_DB: campus_connect_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_connect -d campus_connect_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
